<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For Ananta</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=...&display=swap" rel="stylesheet">
</head>
<body>
  <div id="background-grid"></div>
  <nav class="sidebar">
    <div class="logo">Ananta ❤️</div>
    <ul>
      <li><a href="#home">Home</a></li>
      <li><a href="#memories">Memories</a></li>
      <li><a href="#letter">Letter</a></li>
      <li><a href="#reasons">100 Reasons</a></li>
      <li><a href="#fun">Fun</a></li>
      <li><a href="#playlist">Playlist</a></li>
      <li><a href="#surprise">Surprise</a></li>
    </ul>
    <div class="theme-toggle">
      <input type="checkbox" id="theme-switch">
      <label for="theme-switch">Dark Mode</label>
    </div>
  </nav>
  <main class="content">
    <section id="home"><h1>For my favourite human, Ananta</h1><button onclick="openScrapbook()">Open The Scrapbook</button></section>
    <section id="memories"><h2>Memories</h2><div class="memory-grid"></div></section>
    <section id="letter"><h2>Letter</h2><div class="letter-content"><p>...</p></div></section>
    <section id="reasons"><h2>100 Reasons</h2><div class="reason-grid"></div></section>
    <section id="fun"><h2>Ananta Test</h2><div class="mini-games"></div></section>
    <section id="playlist"><h2>Bandeya Ananta</h2><div class="music-player"></div></section>
    <section id="surprise"><h2>Final Surprise</h2><button onclick="revealSurprise()">Click here</button></section>
  </main>
  <script src="script.js"></script>
</body>
</html>
